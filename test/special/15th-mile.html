<style>
	#ebs {
		position: absolute;
		inset: 0;
		z-index: 3;
		background: {{background_color}};
		opacity: 1;
		transition: opacity 0.35s ease-out;
	}

	#ebs.is-done {
		opacity: 0;
		pointer-events: none;
	}

	#ebs-scene {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
	}

	/* A single dash whose length IS the progress: it is pinned at
	   --ebs-line-from, the point where the path crosses into the frame, and
	   extends backwards from there as loading advances. Blue is pinned to the
	   left edge and runs down; orange is pinned to the right edge and runs up.

	   The trailing value in stroke-dasharray is the gap; it only has to be at
	   least as long as the path so the pattern never repeats.

	   Both paths run far outside the 1920x1080 frame at either end, so
	   --ebs-line-from / --ebs-line-span cover just the stretch that is on
	   screen. Nothing off-canvas is ever drawn, and 0-100% maps exactly onto
	   the part that can be seen. */
	#ebs .ebs-line {
		stroke-dasharray: calc(var(--ebs-line-span) * var(--ebs-progress, 0)) var(--ebs-line-length);
		stroke-dashoffset: calc(var(--ebs-line-span) * var(--ebs-progress, 0) - var(--ebs-line-from));
		/* A zero-length dash still paints its round cap as a dot, so keep the
		   stroke off the screen entirely until there is progress to show. */
		opacity: min(1, calc(var(--ebs-progress, 0) * 40));
		transition: stroke-dasharray 0.2s linear, stroke-dashoffset 0.2s linear,
			opacity 0.2s linear;
	}

	/* runtime.js drives the value per frame once smoothing is on, so the
	   transition would only add lag on top of it. */
	#ebs.is-smooth .ebs-line {
		transition: none;
	}

	/* Measured off the paths: where each one crosses the frame edge, pulled
	   two units inwards so rounding cannot land outside it. */
	#ebs-line-blue {
		--ebs-line-length: 2656px;
		--ebs-line-from: 1794px;
		--ebs-line-span: 1037px;
	}

	#ebs-line-orange {
		--ebs-line-length: 2376px;
		--ebs-line-from: 1690px;
		--ebs-line-span: 1316px;
	}

</style>
