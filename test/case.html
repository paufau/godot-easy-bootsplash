<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Easy Bootsplash case</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
		}

		canvas {
			display: block;
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			background: #111;
		}

		#case-hud {
			position: absolute;
			top: 8px;
			left: 8px;
			z-index: 2147483647;
			display: flex;
			gap: 6px;
			font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
		}

		.lamp {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			padding: 4px 8px;
			border-radius: 999px;
			background: rgba(0, 0, 0, 0.55);
			color: rgba(255, 255, 255, 0.45);
		}

		.lamp::before {
			content: "";
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.25);
		}

		.lamp.on {
			color: #FDE047;
		}

		.lamp.on::before {
			background: #FDE047;
			box-shadow: 0 0 6px #FDE047;
		}
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="case-hud">
		<span class="lamp" id="lamp-hide">hide()</span>
		<span class="lamp" id="lamp-hidden">hidden</span>
	</div>
	<script src="../addons/easy_bootsplash/public/runtime.js"></script>
	<script>
		(async function () {
			"use strict";

			// Mirrors DEFAULT_PARAMETERS in classes/ebs_export_plugin.gd.
			var DEFAULTS = {
				background_color: "#5F5F5F",
				fit: "centered",
				progress_hidden: false,
				progress_placement: "below",
				progress_width: "min(50vw, 360px)",
				progress_height: "10px",
				progress_radius: "999px",
				progress_margin: "12px",
				progress_color: "#FF244A",
				track_color: "rgba(255, 255, 255, 0.9)",
				progress_smoothing_ms: 600,
				hide_awaits_full_progress: false
			};

			var query = new URLSearchParams(location.search);
			var params = Object.assign({}, DEFAULTS);

			function flag(key) {
				var value = query.get(key);

				return value === "1" || value === "true";
			}

			query.forEach(function (value, key) {
				if (key in DEFAULTS) {
					params[key] = typeof DEFAULTS[key] === "boolean" ? flag(key) : value;
				}
			});

			var dismiss = flag("dismiss");
			var jump = flag("jump");
			var hideAt = Number(query.get("hideAt")) || 0;

			window.EBS.params = params;

			var state = {
				params: params,
				dismiss: dismiss,
				hideCalledAtRatio: null,
				lastDisplayed: null,
				overlayRemoved: false
			};
			window.__easyBootsplashCase = state;

			function light(id, label) {
				var lamp = document.getElementById(id);
				lamp.classList.add("on");
				lamp.textContent = label;
			}

			var innerHide = window.EBS.hide;
			window.EBS.hide = function () {
				if (state.hideCalledAtRatio === null) {
					state.hideCalledAtRatio = window.EBS.getProgress();
					light("lamp-hide", "hide() @ " + Math.round(state.hideCalledAtRatio * 100) + "%");
				}

				return innerHide();
			};

			var seenOverlay = false;
			var watcher = setInterval(function () {
				var node = document.getElementById("ebs");

				if (node) {
					seenOverlay = true;
					var value = parseFloat(node.style.getPropertyValue("--ebs-progress"));

					if (!isNaN(value)) {
						state.lastDisplayed = value;
					}
				} else if (seenOverlay) {
					state.overlayRemoved = true;
					light("lamp-hidden", "hidden @ " + Math.round((state.lastDisplayed || 0) * 100) + "%");
					clearInterval(watcher);

					if (query.get("restart") !== "0") {
						setTimeout(function () {
							location.reload();
						}, 1500);
					}
				}
			}, 50);

			var tokens = Object.assign({
				IMAGE_SRC: "../addons/easy_bootsplash/assets/background.png",
				ASSETS_DIR: "../addons/easy_bootsplash/assets",
				PROJECT_NAME: "Easy Bootsplash test case"
			}, params);

			var response = await fetch("../addons/easy_bootsplash/public/default_template.html");

			if (!response.ok) {
				throw new Error("template fetch failed: HTTP " + response.status +
					" — serve the repository root (python3 test/serve.py), not the test/ folder");
			}

			var template = await response.text();
			// Same substitution as classes/ebs_template_enricher.gd.
			var fragment = template.replace(/\{\{(\w+)\}\}/g, function (match, key) {
				return key in tokens ? String(tokens[key]) : match;
			});

			// The export plugin injects the fragment right before <canvas>.
			document.getElementById("canvas").insertAdjacentHTML("beforebegin", fragment);

			window.EBS.hydrate();

			function FakeEngine() {}

			FakeEngine.prototype.startGame = function (config) {
				var onProgress = (config && config.onProgress) || function () {};

				return new Promise(function (resolve) {
					var loaded = 0;
					var total = 100;
					var timer;

					function complete() {
						clearInterval(timer);
						onProgress(total, total);

						if (dismiss) {
							resolve();
						}
					}

					timer = setInterval(function () {
						loaded += 2;

						if (jump && loaded >= 20) {
							clearInterval(timer);
							onProgress(20, total);
							setTimeout(complete, 800);
							return;
						}

						if (loaded >= total) {
							if (dismiss) {
								complete();
								return;
							}

							loaded = 2;
						}

						onProgress(loaded, total);

						if (hideAt > 0 && loaded >= hideAt) {
							hideAt = 0;
							window.EBS.hide();
						}
					}, 100);
				});
			};

			// Assigning triggers runtime.js's Engine setter hook, so the real
			// onProgress wrapping is exercised.
			window.Engine = FakeEngine;
			new window.Engine().startGame({});
		})().catch(function (error) {
			var banner = document.createElement("pre");
			banner.id = "case-error";
			banner.textContent = String(error) +
				(error && error.stack ? "\n" + error.stack : "");
			banner.style.cssText = "position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;" +
				"margin: 0; padding: 12px; background: #7F1D1D; color: #FFF;" +
				"font: 12px/1.5 monospace; white-space: pre-wrap;";
			document.body.appendChild(banner);
		});
	</script>
</body>
</html>
