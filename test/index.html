<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Easy Bootsplash template test bench</title>
	<style>
		:root {
			--bg: #0F172A;
			--surface: #1E293B;
			--surface-deep: #0B1120;
			--border: #334155;
			--text: #F8FAFC;
			--text-dim: #94A3B8;
			--pass: #22C55E;
			--pass-dim: rgba(34, 197, 94, 0.15);
			--fail: #EF4444;
			--fail-dim: rgba(239, 68, 68, 0.12);
			--link: #60A5FA;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px;
			font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--text);
		}

		h1 {
			font-size: 20px;
			font-weight: 600;
			margin: 0;
			text-align: center;
		}

		.subtitle {
			margin: 4px auto 0;
			max-width: 720px;
			font-size: 13px;
			color: var(--text-dim);
			text-align: center;
		}

		#toolbar {
			display: flex;
			align-items: center;
			justify-content: center;
			flex-wrap: wrap;
			gap: 16px;
			margin: 20px 0;
		}

		.segmented {
			display: flex;
			padding: 3px;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--surface-deep);
		}

		.segmented button {
			padding: 6px 14px;
			border: 0;
			border-radius: 6px;
			background: transparent;
			color: var(--text-dim);
			font: inherit;
			font-size: 13px;
			cursor: pointer;
			transition: background 0.15s ease, color 0.15s ease;
		}

		.segmented button:hover {
			color: var(--text);
		}

		.segmented button.active {
			background: var(--surface);
			color: var(--text);
			box-shadow: inset 0 0 0 1px var(--border);
		}

		button:focus-visible,
		a:focus-visible {
			outline: 2px solid var(--link);
			outline-offset: 2px;
		}

		#summary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 5px 12px;
			border: 1px solid var(--border);
			border-radius: 999px;
			font-size: 13px;
			color: var(--text-dim);
		}

		#summary.done.ok {
			color: var(--pass);
			border-color: var(--pass);
			background: var(--pass-dim);
		}

		#summary.done.bad {
			color: var(--fail);
			border-color: var(--fail);
			background: var(--fail-dim);
		}

		#grid {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 16px;
		}

		.case {
			display: flex;
			flex-direction: column;
			gap: 10px;
			padding: 12px;
			border: 1px solid var(--border);
			border-radius: 10px;
			background: var(--surface);
		}

		.case header {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
		}

		.case header a {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			margin-left: auto;
			color: var(--link);
			text-decoration: none;
			font-size: 12px;
		}

		.case header a:hover {
			text-decoration: underline;
		}

		.case header .template {
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 11px;
			color: var(--text-dim);
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			padding: 2px 10px;
			border-radius: 999px;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.04em;
			color: var(--text-dim);
			background: var(--surface-deep);
		}

		.badge.pass {
			color: var(--pass);
			background: var(--pass-dim);
		}

		.badge.fail {
			color: var(--fail);
			background: var(--fail-dim);
		}

		.params {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 6px 8px;
			border-radius: 6px;
			background: var(--surface-deep);
		}

		.params code {
			flex: 1;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 11px;
			line-height: 1.5;
			color: #C9D1D9;
			user-select: all;
			overflow-wrap: anywhere;
		}

		.copy {
			flex-shrink: 0;
			display: inline-flex;
			padding: 4px;
			border: 0;
			border-radius: 4px;
			background: transparent;
			color: var(--text-dim);
			cursor: pointer;
			transition: color 0.15s ease, background 0.15s ease;
		}

		.copy:hover {
			color: var(--text);
			background: var(--border);
		}

		.copy.copied {
			color: var(--pass);
		}

		.case iframe {
			border: 1px solid var(--border);
			border-radius: 6px;
			background: #000;
		}

		.failures {
			margin: 0;
			padding-left: 18px;
			font-size: 12px;
			line-height: 1.5;
			color: #FCA5A5;
		}

		@media (prefers-reduced-motion: reduce) {
			* {
				transition: none !important;
			}
		}
	</style>
</head>
<body>
	<h1>Easy Bootsplash template test bench</h1>
	<p class="subtitle">Renders <code>default_template.html</code> with the real <code>runtime.js</code> and a fake engine, then checks progress bar visibility and position in every fit &times; placement combination.</p>
	<div id="toolbar">
		<div class="segmented" role="group" aria-label="Preview orientation">
			<button id="mode-portrait">Mobile &middot; portrait</button>
			<button id="mode-landscape">Desktop &middot; landscape</button>
		</div>
		<span id="summary">Running&hellip;</span>
	</div>
	<div id="grid"></div>
	<script>
		"use strict";

		// Each entry is the exact `parameters` dictionary a case runs with —
		// shown as JSON on the card so it can be copied into an export preset.
		var CASES = [
			{ fit: "centered", progress_placement: "below" },
			{ fit: "cover", progress_placement: "below" },
			{ fit: "cover", progress_placement: "bottom" },
			{ fit: "cover", progress_placement: "top" },
			{ fit: "cover", progress_placement: "center" },
			{ fit: "contain", progress_placement: "below" },
			{ fit: "contain", progress_placement: "bottom" },
			{ fit: "contain", progress_placement: "top" },
			{ fit: "centered", progress_placement: "bottom" },
			{ fit: "cover", progress_placement: "bottom", progress_width: "100vw", progress_height: "12px", progress_radius: "0", progress_margin: "0" },
			{ fit: "centered", progress_placement: "below", progress_hidden: true },
			{ fit: "centered", progress_placement: "below", progress_smoothing_ms: 3000, hide_awaits_full_progress: true, hideAt: 20, dismiss: 1 },
			{ fit: "centered", progress_placement: "below", progress_smoothing_ms: 3000, hide_awaits_full_progress: false, hideAt: 20, dismiss: 1 },
			// Custom template, default bar switched off: the artwork draws its
			// own two accent strokes instead — blue running left-and-down,
			// orange running right-and-up. This one never dismisses, so the
			// engine keeps looping 0-100 and the sweep stays watchable; with a
			// hideAt the card spent half its cycle showing finished strokes
			// fading out, which reads as the lines retreating.
			{
				template: "special/15th-mile.html",
				background_color: "#E1E1EB",
				progress_hidden: true,
				progress_smoothing_ms: 1200,
				hide_awaits_full_progress: true
			}
		];

		var CONTROL_KEYS = ["hideAt", "dismiss", "jump", "restart", "template", "image"];

		var MODES = {
			portrait: { width: 280, height: 500 },
			landscape: { width: 480, height: 270 }
		};

		var COPY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
		var CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
		var OPEN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';

		function caseUrl(params) {
			var query = new URLSearchParams();

			Object.keys(params).forEach(function (key) {
				query.set(key, String(params[key]));
			});

			return "case.html?" + query.toString();
		}

		function px(value) {
			return Math.round(value * 10) / 10 + "px";
		}

		function describe(node) {
			var id = node.id ? "#" + node.id : "";
			return "<" + node.tagName.toLowerCase() + id + ">";
		}

		// A custom template can drop the bar and let the artwork draw itself
		// instead. Each stroke is a single dash whose length is the progress,
		// pinned at --ebs-line-from and growing back by --ebs-line-span, and
		// it has to stay inside the artwork's viewBox the whole way.
		var ACCENT_LINES = ["ebs-line-blue", "ebs-line-orange"];
		var ACCENT_VIEWBOX = { width: 1920, height: 1080 };

		function collectAccentFailures(win, displayed) {
			var doc = win.document;
			var failures = [];

			ACCENT_LINES.forEach(function (id) {
				var line = doc.getElementById(id);

				if (!line) {
					failures.push("#" + id + " is missing from the DOM");
					return;
				}

				var style = win.getComputedStyle(line);
				var length = line.getTotalLength();
				var from = parseFloat(style.getPropertyValue("--ebs-line-from"));
				var span = parseFloat(style.getPropertyValue("--ebs-line-span"));
				var pattern = style.strokeDasharray.split(/[\s,]+/).map(function (part) {
					return parseFloat(part);
				});

				if (pattern.length !== 2 || !(pattern[1] >= length)) {
					failures.push("#" + id + " needs a dash plus a gap of at least its " +
						Math.round(length) + "-unit path, got \"" + style.strokeDasharray +
						"\", so the pattern repeats");
					return;
				}

				// The dash length IS the progress — this is what makes the
				// stroke grow rather than merely move.
				if (Math.abs(pattern[0] - span * displayed) > 1) {
					failures.push("#" + id + " draws " + Math.round(pattern[0]) + " units at " +
						Math.round(displayed * 100) + "%, expected " + Math.round(span * displayed));
					return;
				}

				// A calc() that only depends on custom properties stays
				// unresolved in the computed value: "calc(-1115.52px)".
				var start = -parseFloat(style.strokeDashoffset.replace("calc(", ""));

				if (isNaN(start) || Math.abs(start - (from - span * displayed)) > 1) {
					failures.push("#" + id + " starts its dash at " + Math.round(start) +
						" at " + Math.round(displayed * 100) + "%, expected " +
						Math.round(from - span * displayed) + " — the pinned end drifted");
					return;
				}

				// Whatever the sampled instant happens to be, the mapping has
				// to keep the drawing on screen the whole way — both paths run
				// far outside the frame at either end.
				var edge = parseFloat(style.strokeWidth) / 2;

				for (var step = 0; step <= 20; step++) {
					var at = step / 20;
					var head = line.getPointAtLength(from - span * at);

					if (head.x < -edge || head.x > ACCENT_VIEWBOX.width + edge ||
						head.y < -edge || head.y > ACCENT_VIEWBOX.height + edge) {
						failures.push("#" + id + " draws off-canvas at " + Math.round(at * 100) +
							"% (" + Math.round(head.x) + ", " + Math.round(head.y) +
							"), so that part of the load is invisible");
						break;
					}
				}
			});

			return failures;
		}

		function collectFailures(win, params) {
			var doc = win.document;
			var failures = [];
			var track = doc.getElementById("ebs-track");

			if (!track) {
				var caseError = doc.getElementById("case-error");

				if (!caseError && win.__easyBootsplashCase && win.__easyBootsplashCase.overlayRemoved) {
					return [];
				}

				return [caseError
					? "case page crashed: " + caseError.textContent
					: "#ebs-track is missing from the DOM"];
			}

			var display = win.getComputedStyle(track).display;
			var root = doc.getElementById("ebs");
			var progress = parseFloat(root ? root.style.getPropertyValue("--ebs-progress") : "");

			if (params.template) {
				failures = failures.concat(collectAccentFailures(win, progress || 0));
			}

			if (params.progress_hidden) {
				if (display !== "none") {
					failures.push("progress_hidden is true but the bar is visible (display: " + display + ")");
				}

				return failures;
			}

			if (display === "none") {
				return ["bar is hidden (display: none) even though progress_hidden is false"];
			}

			var rect = track.getBoundingClientRect();
			var vw = win.innerWidth;
			var vh = win.innerHeight;

			if (rect.width <= 0 || rect.height <= 0) {
				failures.push("track has zero size");
			}

			if (rect.top < 0 || rect.left < 0 || rect.bottom > vh || rect.right > vw) {
				failures.push("track overflows the viewport (top " + Math.round(rect.top) +
					", bottom " + Math.round(rect.bottom) + ", viewport height " + vh + ")");
			}

			if (!(progress > 0)) {
				failures.push("progress never updates (--ebs-progress = " +
					(root ? root.style.getPropertyValue("--ebs-progress") || "empty" : "no #ebs") + ")");
			}

			if (Number(params.progress_smoothing_ms) > 0) {
				var raw = win.EBS.getProgress();

				if (progress > raw + 0.001) {
					failures.push("smoothing: displayed progress (" + progress.toFixed(3) +
						") is ahead of the raw ratio (" + raw.toFixed(3) + ")");
				}

				if (root && !root.classList.contains("is-smooth")) {
					failures.push("smoothing is on but #ebs never got the is-smooth class");
				}
			}

			var fill = doc.getElementById("ebs-fill");

			if (!fill || fill.getBoundingClientRect().width <= 0) {
				failures.push("#ebs-fill stays empty");
			}

			var cx = rect.left + rect.width / 2;
			var cy = rect.top + rect.height / 2;
			var hit = doc.elementFromPoint(cx, cy);

			if (hit && hit !== track && !track.contains(hit)) {
				failures.push("track center is covered by " + describe(hit));
			}

			if ((params.progress_width || "").slice(-2) === "vw") {
				var expectedWidth = vw * parseFloat(params.progress_width) / 100;

				if (Math.abs(rect.width - expectedWidth) > 2) {
					failures.push("track width is " + px(rect.width) + ", expected " + px(expectedWidth));
				}
			}

			if (parseFloat(params.progress_radius) === 0) {
				var radius = parseFloat(win.getComputedStyle(track).borderTopLeftRadius);

				if (radius > 0) {
					failures.push("track still has a border radius (" + px(radius) + ")");
				}
			}

			var margin = parseFloat(win.EBS.params.progress_margin);

			switch (params.progress_placement) {
				case "top":
					if (Math.abs(rect.top - margin) > 2) {
						failures.push("top: gap to the top edge is " + px(rect.top) +
							", expected " + px(margin));
					}
					break;
				case "center":
					if (Math.abs(cy - vh / 2) > 10) {
						failures.push("center: track center is at " + Math.round(cy) +
							", expected " + Math.round(vh / 2));
					}
					break;
				case "bottom":
					if (Math.abs(vh - rect.bottom - margin) > 2) {
						failures.push("bottom: gap to the bottom edge is " + px(vh - rect.bottom) +
							", expected " + px(margin));
					}
					break;
				case "below":
					var art = doc.getElementById("ebs-art");

					if (params.fit === "cover" || params.fit === "contain") {
						var artBottom = parseFloat(root.style.getPropertyValue("--ebs-art-bottom"));

						if (isNaN(artBottom)) {
							artBottom = vh;
						}

						var gap = parseFloat(win.getComputedStyle(root).rowGap) || 0;
						var expectedTop = Math.min(artBottom + gap, vh - margin - rect.height);

						if (Math.abs(rect.top - expectedTop) > 2) {
							failures.push("below: track top is at " + px(rect.top) + ", expected " +
								px(expectedTop) + " (art bottom " + px(artBottom) + " + gap " +
								px(gap) + ", clamped to the page bottom)");
						}
					} else if (art && rect.top <= art.getBoundingClientRect().bottom) {
						failures.push("below: track is not below the logo");
					}
					break;
			}

			return failures;
		}

		function pollUntil(check, timeoutMs) {
			return new Promise(function (resolve) {
				var started = performance.now();
				var timer = setInterval(function () {
					var done = check();

					if (done || performance.now() - started > timeoutMs) {
						clearInterval(timer);
						resolve(done);
					}
				}, 100);
			});
		}

		function waitForCompletion(win, params, timeoutMs) {
			return pollUntil(function () {
				return Boolean(win.__easyBootsplashCase && win.__easyBootsplashCase.overlayRemoved);
			}, timeoutMs).then(function (removed) {
				if (!removed) {
					return ["overlay was never dismissed"];
				}

				var state = win.__easyBootsplashCase;
				var failures = [];

				if (params.hideAt && state.hideCalledAtRatio === null) {
					failures.push("hide() was never called");
				}

				if (Number(params.progress_smoothing_ms) > 0 && params.hideAt) {
					var displayed = state.lastDisplayed;

					if (params.hide_awaits_full_progress && !(displayed >= 0.95)) {
						failures.push("hide_awaits_full_progress: overlay went at " +
							Math.round((displayed || 0) * 100) + "%, expected ~100%");
					}

					if (!params.hide_awaits_full_progress && !(displayed <= params.hideAt / 100 + 0.1)) {
						failures.push("overlay waited until " + Math.round((displayed || 0) * 100) +
							"% although hide_awaits_full_progress is off");
					}
				}

				return failures;
			});
		}

		function waitForProgress(win, params, timeoutMs) {
			return pollUntil(function () {
				var doc = win.document;
				var root = doc && doc.getElementById("ebs");
				var track = doc && doc.getElementById("ebs-track");

				// A hidden bar has no progress to watch — unless the template
				// animates something else off the same value.
				return params.progress_hidden && !params.template
					? Boolean(track)
					: Boolean(root) && parseFloat(root.style.getPropertyValue("--ebs-progress")) > 0;
			}, timeoutMs);
		}

		function runCase(params, cell) {
			return new Promise(function (resolve) {
				var iframe = cell.querySelector("iframe");

				function report(failures) {
					var badge = cell.querySelector(".badge");
					badge.textContent = failures.length ? "FAIL" : "PASS";
					badge.classList.add(failures.length ? "fail" : "pass");

					if (failures.length) {
						var list = document.createElement("ul");
						list.className = "failures";
						failures.forEach(function (text) {
							var item = document.createElement("li");
							item.textContent = text;
							list.appendChild(item);
						});
						cell.appendChild(list);
					}

					resolve(failures.length === 0);
				}

				var checked = false;

				iframe.addEventListener("load", function () {
					if (checked) {
						return;
					}

					checked = true;
					waitForProgress(iframe.contentWindow, params, 5000).then(function () {
						var evaluate = function () {
							try {
								return collectFailures(iframe.contentWindow, params);
							} catch (error) {
								return ["check failed to run: " + error.message];
							}
						};

						// A measurement can catch a CSS transition mid-frame:
						// poll until the checks pass or a short deadline expires.
						var deadline = performance.now() + 1000;
						var timer = setInterval(function () {
							var failures = evaluate();

							if (!failures.length || performance.now() > deadline) {
								clearInterval(timer);

								if (params.hideAt || params.dismiss) {
									waitForCompletion(iframe.contentWindow, params, 15000).then(function (rest) {
										report(failures.concat(rest));
									});
								} else {
									report(failures);
								}
							}
						}, 100);
					});
				});
			});
		}

		var grid = document.getElementById("grid");
		var summary = document.getElementById("summary");
		var buttons = {
			portrait: document.getElementById("mode-portrait"),
			landscape: document.getElementById("mode-landscape")
		};

		function render(mode) {
			Object.keys(buttons).forEach(function (key) {
				buttons[key].classList.toggle("active", key === mode);
			});
			grid.textContent = "";
			summary.textContent = "Running…";
			summary.className = "";

			var size = MODES[mode];
			var runs = CASES.map(function (params) {
				var url = caseUrl(params);
				var json = JSON.stringify(params, function (key, value) {
					return CONTROL_KEYS.indexOf(key) === -1 ? value : undefined;
				}, 1).replace(/\n\s*/g, " ");

				var cell = document.createElement("div");
				cell.className = "case";
				cell.style.width = size.width + 26 + "px";

				var header = document.createElement("header");
				var badge = document.createElement("span");
				badge.className = "badge";
				badge.textContent = "…";
				var link = document.createElement("a");
				link.href = url;
				link.target = "_blank";
				link.innerHTML = OPEN_ICON + " Open full size";
				header.append(badge, link);

				if (params.template) {
					var template = document.createElement("span");
					template.className = "template";
					template.textContent = params.template;
					header.insertBefore(template, link);
				}

				var paramsRow = document.createElement("div");
				paramsRow.className = "params";
				var code = document.createElement("code");
				code.textContent = json;
				var copy = document.createElement("button");
				copy.className = "copy";
				copy.type = "button";
				copy.title = "Copy parameters";
				copy.setAttribute("aria-label", "Copy parameters");
				copy.innerHTML = COPY_ICON;
				copy.addEventListener("click", function () {
					navigator.clipboard.writeText(json).then(function () {
						copy.classList.add("copied");
						copy.innerHTML = CHECK_ICON;
						setTimeout(function () {
							copy.classList.remove("copied");
							copy.innerHTML = COPY_ICON;
						}, 1200);
					});
				});
				paramsRow.append(code, copy);

				var iframe = document.createElement("iframe");
				iframe.src = url;
				iframe.width = size.width;
				iframe.height = size.height;
				iframe.setAttribute("title", json);

				cell.append(header, paramsRow, iframe);
				grid.appendChild(cell);

				return runCase(params, cell);
			});

			Promise.all(runs).then(function (results) {
				var passed = results.filter(Boolean).length;
				summary.textContent = passed + " of " + results.length + " cases passed";
				summary.classList.add("done", passed === results.length ? "ok" : "bad");
			});
		}

		buttons.portrait.addEventListener("click", function () { render("portrait"); });
		buttons.landscape.addEventListener("click", function () { render("landscape"); });

		var initialMode = new URLSearchParams(location.search).get("mode");
		render(initialMode in MODES ? initialMode : "landscape");
	</script>
</body>
</html>
