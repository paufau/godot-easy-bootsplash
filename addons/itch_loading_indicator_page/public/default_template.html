<div id="ilip" class="fit-{{fit}}">
	<img id="ilip-art" alt="" data-src="{{IMAGE_SRC}}" onerror="this.remove()">
	<div id="ilip-track" class="pos-{{progress_placement}} hidden-{{progress_hidden}}"><div id="ilip-fill"></div></div>
</div>
<style>
	#ilip {
		position: absolute;
		inset: 0;
		z-index: 3;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		--ilip-gap: 32px;
		gap: var(--ilip-gap);
		background: {{background_color}};
		opacity: 1;
		transition: opacity 0.35s ease-out;
	}

	#ilip.is-done {
		opacity: 0;
		pointer-events: none;
	}

	#ilip-art {
		width: 256px;
		max-width: 60vw;
		height: auto;
		max-height: 50vh;
		object-fit: contain;
	}

	#ilip.fit-cover #ilip-art,
	#ilip.fit-contain #ilip-art {
		position: absolute;
		inset: 0;
		width: 100%;
		max-width: none;
		height: 100%;
		max-height: none;
	}

	#ilip.fit-cover #ilip-art {
		object-fit: cover;
	}

	#ilip.fit-contain #ilip-art {
		object-fit: contain;
	}

	#ilip-track {
		position: relative;
		width: {{progress_width}};
		height: {{progress_height}};
		border-radius: {{progress_radius}};
		overflow: hidden;
		background: {{track_color}};
		box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 2px 12px rgba(0, 0, 0, 0.3);
	}

	#ilip-track.hidden-true {
		display: none;
	}

	#ilip-track.pos-top,
	#ilip-track.pos-center,
	#ilip-track.pos-bottom {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
	}

	#ilip-track.pos-top {
		top: {{progress_margin}};
	}

	#ilip-track.pos-center {
		top: 50%;
		transform: translate(-50%, -50%);
	}

	#ilip-track.pos-bottom {
		bottom: {{progress_margin}};
	}

	/* runtime.js measures the rendered art bottom into --ilip-art-bottom;
	   clamped to the page bottom when there is no room under the image. */
	#ilip.fit-cover #ilip-track.pos-below,
	#ilip.fit-contain #ilip-track.pos-below {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
		top: min(calc(var(--ilip-art-bottom, 100%) + var(--ilip-gap)), calc(100% - {{progress_margin}} - {{progress_height}}));
	}

	#ilip-fill {
		width: var(--ilip-progress-percent, 0%);
		height: 100%;
		background: {{progress_color}};
		transition: width 0.2s linear;
	}
</style>
